services:
  postgres:
    container_name: DevShowcase
    image: postgres:16
    environment:
      POSTGRES_DB: ${KEY_POSTGRES_DB}
      POSTGRES_PASSWORD: ${KEY_POSTGRES_PASSWORD}
      POSTGRES_USER: ${KEY_POSTGRES_NAME}
    ports:
      - "${KEY_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: